name: viewer
description: "判断画面の Web 版：歩行ログを engine に流し直して見せる"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  engine:
    path: ../engine
  file_selector: ^1.0.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/reason_codes.json
    - assets/map.json
    - assets/walks/
