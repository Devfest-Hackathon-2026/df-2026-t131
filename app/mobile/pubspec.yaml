name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audio_session: ^0.2.4
  camera: ^0.12.2
  # 判断エンジン（メンバー2の app/engine。同じリポジトリの中を path で参照する）
  engine:
    path: ../engine
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_activity_recognition: ^4.0.0
  flutter_tts: ^4.2.5
  geolocator: ^14.0.1
  google_mlkit_face_detection: ^1.0.0
  http: ^1.6.0
  image: ^4.12.0
  path_provider: ^2.1.6
  permission_handler: 12.0.1
  permission_handler_android: 13.0.1
  speech_to_text: ^7.5.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # schema/reason_codes.json の写し（判断の理由コードの説明。ずれたら test/reason_codes_test.dart が落ちる）
    - assets/reason_codes.json
