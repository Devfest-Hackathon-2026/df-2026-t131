# 警報ジョブのコンテナを作る。リポジトリの一番上で:
#   gcloud builds submit --config cloud/alert-job/cloudbuild.yaml .
substitutions:
  _REGION: asia-northeast1
  _REPO: app
  _IMAGE: alert-job
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - cloud/alert-job/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
