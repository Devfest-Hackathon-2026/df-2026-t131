# viewer（Flutter Web）を配る。Cloud Run は 8080 に届ける。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/octet-stream;

    # 中身が変わるファイルは毎回確かめる（地図データ・歩行ログ・起動ファイル）
    location ~* \.(json|jsonl)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 画面の中の移動は index.html に返す。
    # Flutter Web のファイル名（main.dart.js など）は版が変わっても同じなので、ほかのファイルも毎回確かめる
    # （確かめないと、前に開いたブラウザで古い版が出る。11/8 に Chrome で動画の欄が出なかった）。
    # 中身が同じなら 304 が返るだけで、もう一度は送らない
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
