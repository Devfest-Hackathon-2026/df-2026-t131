# CI（tasks/README.md 5章）。赤いものは main にマージしない。
# ジョブ名はブランチ保護の「必須チェック」に登録するので変えない。
# まだ中身が無いディレクトリ（engine・cloud のテスト）は、そのステップを飛ばして緑にする。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-and-forbidden:
    name: schema と禁止事項
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # コミットの日時を確かめるため、履歴を全部取る
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r schema/requirements.txt
      - name: schema の検証（見本・manual・engine の歩行ログ）
        run: python schema/validate.py
      - name: 禁止事項の検出（画像・秘密情報・engine の決定論）
        run: python .github/scripts/check_forbidden.py
      - name: 開発開始前の日時のコミットが無いか
        run: python .github/scripts/check_commit_dates.py

  cloud-tests:
    name: cloud の pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pytest（tests/ があるディレクトリだけ）
        run: |
          pip install -r schema/requirements.txt
          ran=0
          for d in cloud/api cloud/alert-job cloud/data; do
            if [ -d "$d/tests" ]; then
              echo "::group::$d"
              if [ -f "$d/requirements.txt" ]; then pip install -r "$d/requirements.txt"; fi
              pip install pytest
              (cd "$d" && python -m pytest -q)
              echo "::endgroup::"
              ran=1
            fi
          done
          if [ "$ran" = 0 ]; then echo "cloud にテストがまだ無いので飛ばします"; fi

  engine-tests:
    name: engine の dart test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: has_engine
        run: |
          if [ -f app/engine/pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      # Dart の版は tasks/README.md 10章（Flutter 3.47.9 に同梱の Dart）にそろえる
      - uses: dart-lang/setup-dart@v1
        if: steps.has_engine.outputs.exists == 'true'
        with:
          sdk: 3.13.7
      - name: dart test
        if: steps.has_engine.outputs.exists == 'true'
        working-directory: app/engine
        run: |
          dart pub get
          dart test
      - if: steps.has_engine.outputs.exists != 'true'
        run: echo "app/engine がまだ無いので飛ばします"

  # viewer のテスト：地図データ（assets/map.json）が cloud/data から書き出し直した結果と同じか、
  # 理由コードの写し（assets/reason_codes.json）が schema とずれていないかも、ここで止まる
  viewer-tests:
    name: viewer の flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: has_viewer
        run: |
          if [ -f app/viewer/pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      # Flutter の版は tasks/README.md 10章にそろえる
      - uses: subosito/flutter-action@v2
        if: steps.has_viewer.outputs.exists == 'true'
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: flutter test
        if: steps.has_viewer.outputs.exists == 'true'
        working-directory: app/viewer
        run: |
          flutter pub get
          flutter test
      - if: steps.has_viewer.outputs.exists != 'true'
        run: echo "app/viewer がまだ無いので飛ばします"

  # mobile のテスト：Android の実機・SDK は使わない（flutter test は端末なしで動く）。
  # google-services.json はリポジトリに無いが、無くてもビルド・テストできる作り（app/mobile/README.md）
  mobile-tests:
    name: mobile の flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: has_mobile
        run: |
          if [ -f app/mobile/pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      # Flutter の版は tasks/README.md 10章にそろえる
      - uses: subosito/flutter-action@v2
        if: steps.has_mobile.outputs.exists == 'true'
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: flutter test
        if: steps.has_mobile.outputs.exists == 'true'
        working-directory: app/mobile
        run: |
          flutter pub get
          flutter test
      - if: steps.has_mobile.outputs.exists != 'true'
        run: echo "app/mobile がまだ無いので飛ばします"
